kind = "web"
previewPath = "/"
title = "ShifaKinetix"
description = "A polished prototype for guided musculoskeletal care, connecting patients with doctors and physiotherapists through structured intake, safety gating, AI-assisted guidance, persistent consultation threads, and follow-up monitoring."
version = "1.0.0"
id = "artifacts/shifakinetix"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21112

[services.development]
run = "pnpm --filter @workspace/shifakinetix run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shifakinetix", "run", "build" ]
serve = "static"
publicDir = "artifacts/shifakinetix/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21112"
BASE_PATH = "/"
